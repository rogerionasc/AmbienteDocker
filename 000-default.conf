<VirtualHost *:80>
    ServerName appweb.local
    ServerAlias webclinic.local *.webclinic.local localhost
    DocumentRoot /var/www/html/appWeb/public

    <Directory /var/www/html/appWeb/public>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/appweb_error.log
    CustomLog ${APACHE_LOG_DIR}/appweb_access.log combined
</VirtualHost>
